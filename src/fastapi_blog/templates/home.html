{% extends "layout.html" %}
{% block content %}
  {% for post in posts %}
    <article class="content-section py-4 px-6 mb-6 flex items-start gap-4">
      <!-- Profile Image -->
      <img class="rounded-full article-img shrink-0 object-cover"
           src="{{ url_for('static', path='profile_pics/default.jpg') }}"
           alt="{{ post.author }}'s profile picture"
           width="64"
           height="64"
           loading="lazy">
      
      <!-- Post Body -->
      <div class="flex-1 min-w-0">
        <!-- Metadata -->
        <div class="article-metadata mb-2 flex items-center justify-between text-sm pb-2 border-b border-slate-200 dark:border-slate-800">
          <div>
            <a class="font-semibold text-slate-700 dark:text-slate-200 mr-2 hover:text-blue-500" href="#">{{ post.author }}</a>
            <span class="text-slate-500 dark:text-slate-400 text-xs">{{ post.date_posted }}</span>
          </div>
        </div>
        
        <!-- Title -->
        <h2 class="mb-2">
          <a class="article-title text-xl font-bold text-slate-900 dark:text-white hover:text-blue-500" href="{{ url_for("post_page", post_id=post.id) }}">{{ post.title }}</a>
        </h2>
        
        <!-- Content -->
        <p class="article-content text-slate-600 dark:text-slate-300 text-base">
          {{ post.content }}
        </p>
      </div>
    </article>
  {% endfor %}
{% endblock content %}
