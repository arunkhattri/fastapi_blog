{% extends "layout.html" %}
{% block content %}
    <article class="content-section py-4 px-6 mb-6">
        <div class="flex items-start gap-4">
            <img class="rounded-full article-img shrink-0 object-cover"
                 src="{{ url_for('static', path='profile_pics/default.jpg') }}"
                 alt="{{ post.author }}'s profile picture"
                 width="64"
                 height="64"
                 loading="lazy">
            <div class="flex-1 min-w-0">
                <div class="article-metadata mb-3 pb-2 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between text-sm">
                    <div>
                        <a class="font-semibold text-slate-700 dark:text-slate-200 mr-2 hover:text-blue-500" href="#">{{ post.author }}</a>
                        <span class="text-slate-500 dark:text-slate-400 text-xs">{{ post.date_posted }}</span>
                    </div>
                </div>

                <h2 class="mb-2">
                    <a class="article-title text-xl font-bold text-slate-900 dark:text-white" href="#">{{ post.title }}</a>
                </h2>

                <p class="article-content text-slate-600 dark:text-slate-300 mb-4">{{ post.content }}</p>

                <!-- Only show edit/delete options if the user is the author -->
                <!-- TODO: Add user authentication and authorization -->
                <div class="post-actions mt-4 pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center space-x-2">
                    <a class="px-3 py-1.5 text-sm font-medium border border-slate-300 dark:border-slate-600 rounded-md text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" href="#">Edit Post</a>

                    <button type="button"
                            id="openDeleteModal"
                            class="px-3 py-1.5 text-sm font-medium border border-red-300 dark:border-red-900/50 rounded-md text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/50 transition cursor-pointer">
                        Delete Post
                    </button>
                </div>
                <!-- TODO: Add user authentication and authorization -->
            </div>
        </div>
    </article>

    <!-- Delete Confirmation Modal (Tailwind Equivalent) -->
    <div id="deleteModal"
         class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs hidden"
         role="dialog"
         aria-modal="true"
         aria-labelledby="deleteModalLabel">
        <div class="bg-white dark:bg-slate-900 rounded-lg shadow-xl max-w-md w-full mx-4 border border-slate-200 dark:border-slate-800 overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                <h5 class="text-lg font-semibold text-slate-900 dark:text-white" id="deleteModalLabel">Delete Post?</h5>
                <button type="button"
                        id="closeDeleteModalIcon"
                        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer text-xl font-bold">
                    &times;
                </button>
            </div>

            <!-- TODO: <form action="#" method="post"> -->
            <form action="#">
                <div class="p-6 text-slate-600 dark:text-slate-300 text-sm">
                    Are you sure you want to delete this post? This action cannot be undone.
                </div>
                <div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-800 flex justify-end space-x-3">
                    <button type="button"
                            id="closeDeleteModalBtn"
                            class="px-4 py-2 text-sm font-medium border border-slate-300 dark:border-slate-600 rounded-md text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition cursor-pointer">
                        Cancel
                    </button>
                    <button type="submit"
                            class="px-4 py-2 text-sm font-medium bg-red-600 hover:bg-red-700 text-white rounded-md transition shadow-sm cursor-pointer">
                        Delete
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Toggle Script -->
    <script>
     const deleteModal = document.getElementById('deleteModal');
     const openModalBtn = document.getElementById('openDeleteModal');
     const closeModalBtn = document.getElementById('closeDeleteModalBtn');
     const closeModalIcon = document.getElementById('closeDeleteModalIcon');

     const toggleModal = (show) => {
         if (show) {
             deleteModal.classList.remove('hidden');
         } else {
             deleteModal.classList.add('hidden');
         }
     };

     openModalBtn.addEventListener('click', () => toggleModal(true));
     closeModalBtn.addEventListener('click', () => toggleModal(false));
     closeModalIcon.addEventListener('click', () => toggleModal(false));

     // Close on clicking outside the modal content box
     deleteModal.addEventListener('click', (e) => {
         if (e.target === deleteModal) {
             toggleModal(false);
         }
     });
    </script>
{% endblock content %}
